name: CI

on:
  push:
    # The API repository pushes contract/update. Its pull request is opened by
    # github-actions (contract-pr.yml), which starts no pull_request run.
    branches: [main, contract/update]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Mintlify validate, broken links, generated reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false
      # openapi.json must already have the samples from sdk-samples/.
      - run: npm run generate && git diff --exit-code openapi.json
      # What would break Mintlify's build of main.
      - run: npm run check
