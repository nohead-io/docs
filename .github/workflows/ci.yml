name: CI

on:
  push:
    # The API repository pushes contract/update, and this push run is its
    # check. Its pull request is opened by github-actions (contract-pr.yml),
    # so GitHub holds that pull request's run for approval: a duplicate.
    branches: [main, contract/update]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Mintlify validate, broken links, generated reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      # openapi.json must already have the samples from sdk-samples/.
      # openapi.json and the CLI reference are generated: new or changed files mean a stale commit.
      - run: npm run generate && test -z "$(git status --porcelain -- openapi.json docs.json cli)"
      # What would break Mintlify's build of main.
      - run: npm run check

  code:
    name: Guides' code blocks against the published SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      # Python 3 and Ruby come with the runner.
      - run: npm run check:code

  secrets:
    name: Secrets in the git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks' default rules and Nohead's own key shapes (.gitleaks.toml),
      # over the whole history of the commit under test (not other branches):
      # it takes seconds. The image is gitleaks 8.30.0.
      - run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --log-opts=HEAD --no-banner --redact --exit-code 1
