name: CI

on:
  push:
    # The API repository pushes contract/update, and this push run is its
    # check. Its pull request is opened by github-actions (contract-pr.yml),
    # so GitHub holds that pull request's run for approval: a duplicate.
    branches: [main, contract/update]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Mintlify validate, broken links, generated reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      # openapi.json must already have the samples from sdk-samples/.
      # openapi.json and the CLI reference are generated: new or changed files mean a stale commit.
      - run: npm run generate && test -z "$(git status --porcelain -- openapi.json cli)"
      # What would break Mintlify's build of main.
      - run: npm run check

  code:
    name: Guides' code blocks against the published SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      # Python 3 and Ruby come with the runner.
      - run: npm run check:code
