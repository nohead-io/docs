# Brings the SDKs' code samples and the CLI reference up to date every day:
# fetches each SDK's samples.json and the CLI's commands.json from their main
# branches, regenerates openapi.json and the CLI pages and, when
# anything changed, checks the site and opens (or updates) a pull request.
#
# Two jobs, so the site check (npx mint, with dependencies that have no
# lockfile here) never runs where the token can push: `update` regenerates and
# checks with read access only, and outputs the change's hash; `pull-request`
# regenerates it again (the scripts use only Node itself), checks it is the
# same change, and opens the pull request.
name: Code samples

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samples
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      change: ${{ steps.change.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm run samples
      # Empty when nothing changed.
      - id: change
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo "hash=$(git diff --cached --binary | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi
      # A pull request opened with the workflow's token gets a CI run only
      # once someone approves it, so the check runs here.
      - if: steps.change.outputs.hash != ''
        run: npm run check

  pull-request:
    needs: update
    if: needs.update.outputs.change != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the samples/update branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The update is pushed with the workflow's own token; nothing but the
          # repository's own scripts runs here. # zizmor: ignore[artipacked]
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm run samples
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANGE: ${{ needs.update.outputs.change }}
        run: |
          set -euo pipefail
          git add -A
          # The change the site check passed, not one that came in since.
          if [ "$(git diff --cached --binary | sha256sum | cut -d' ' -f1)" != "$CHANGE" ]; then
            echo "::error::The samples changed since the check; the next run picks them up"; exit 1
          fi
          git switch -C samples/update
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update the SDK code samples and CLI reference"
          git push --force origin samples/update
          if [ -z "$(gh pr list -R "$REPO" --head samples/update --state open --json number --jq '.[0].number')" ]; then
            gh pr create -R "$REPO" --base main --head samples/update --title "Update the SDK code samples and CLI reference" \
              --body "The SDKs' samples.json or the CLI's commands.json changed. This updates sdk-samples/, the code samples in openapi.json, cli/commands.json and the CLI reference pages; the site check passed in the run that opened it."
          fi
