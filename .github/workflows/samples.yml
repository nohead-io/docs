# Brings the SDKs' code samples up to date every day: fetches each SDK's
# samples.json from its main branch, regenerates openapi.json and, when
# anything changed, checks the site and opens (or updates) a pull request.
name: Code samples

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samples
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the samples/update branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The update is pushed with the workflow's own token. # zizmor: ignore[artipacked]
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm run samples
      - name: Changed?
        id: changed
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # A pull request opened with the workflow's token starts no CI, so the
      # check runs here.
      - if: steps.changed.outputs.changed == 'true'
        run: npm run check
      - name: Open or update the pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git switch -C samples/update
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -am "Update the SDK code samples"
          git push --force origin samples/update
          if [ -z "$(gh pr list -R "$REPO" --head samples/update --state open --json number --jq '.[0].number')" ]; then
            gh pr create -R "$REPO" --base main --head samples/update --title "Update the SDK code samples" \
              --body "The SDKs' samples.json changed. This updates sdk-samples/ and the code samples in openapi.json; the site check passed in the run that opened it."
          fi
